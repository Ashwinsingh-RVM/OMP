<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter PIN · OMP CRM</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0e1116; color: #e6e9ef;
    }
    .card {
      width: min(92vw, 380px); padding: 40px 32px; border-radius: 16px;
      background: #161b22; border: 1px solid #222b36; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #7d8794; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #9aa4b2; font-size: 14px; margin: 0 0 24px; }
    .who { color: #d7dce3; font-weight: 600; }
    input {
      width: 100%; padding: 13px 16px; font-size: 22px; letter-spacing: .35em;
      text-align: center; border-radius: 10px; border: 1px solid #2b3542;
      background: #0e1116; color: #e6e9ef; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input:focus { outline: none; border-color: #0a5540; box-shadow: 0 0 0 3px rgba(10,85,64,.35); }
    button {
      margin-top: 14px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      border-radius: 10px; border: none; background: #0a5540; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    button:hover:not(:disabled) { background: #0c6a4f; }
    .err { margin-top: 16px; font-size: 13px; color: #ff6b6b; min-height: 32px; }
    .out { margin-top: 20px; font-size: 12px; }
    .out a { color: #7d8794; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Recykal · OMP</div>
    <h1>Enter your PIN</h1>
    <p>Signed in as <span class="who" id="who">…</span></p>
    <form id="form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off"
             maxlength="12" placeholder="••••••" aria-label="PIN" autofocus />
      <button id="go" type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
    <div class="out"><a href="/auth/logout">Sign in as someone else</a></div>
  </div>
  <script src="/pin.js"></script>
</body>
</html>
