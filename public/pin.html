<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter PIN · OMP CRM</title>
  <style>
    /* Light only, matching the sign-in screen. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      background-image: radial-gradient(1100px 520px at 50% -10%, #e8f2ed 0%, rgba(246,247,249,0) 62%);
      color: #1c2430;
    }
    .card {
      width: min(92vw, 380px); padding: 40px 32px; border-radius: 16px;
      background: #fff; border: 1px solid #e3e6ea; text-align: center;
      box-shadow: 0 14px 40px rgba(20,40,32,.09);
    }
    .logo { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #0a5540; font-weight: 700; }
    h1 { font-size: 22px; margin: 12px 0 6px; color: #12211b; }
    p { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
    .who { color: #12211b; font-weight: 600; }
    input {
      width: 100%; padding: 13px 16px; font-size: 22px; letter-spacing: .35em;
      text-align: center; border-radius: 10px; border: 1px solid #d4d9df;
      background: #fff; color: #1c2430; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input::placeholder { color: #c2c9d1; }
    input:focus { outline: none; border-color: #0a5540; box-shadow: 0 0 0 3px rgba(10,85,64,.14); }
    button {
      margin-top: 14px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      border-radius: 10px; border: none; background: #0a5540; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    button:hover:not(:disabled) { background: #0c6a4f; }
    .err { margin-top: 16px; font-size: 13px; color: #b3261e; min-height: 32px; }
    .out { margin-top: 20px; font-size: 12px; }
    .out a { color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Recykal · OMP</div>
    <h1>Enter your PIN</h1>
    <p>Signed in as <span class="who" id="who">…</span></p>
    <form id="form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off"
             maxlength="12" placeholder="••••••" aria-label="PIN" autofocus />
      <button id="go" type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
    <div class="out"><a href="/auth/logout">Sign in as someone else</a></div>
  </div>
  <script src="/pin.js"></script>
</body>
</html>
