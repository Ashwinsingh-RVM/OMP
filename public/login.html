<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · OMP CRM</title>
  <style>
    /* Light only — the app is used in bright warehouse offices all day. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      background-image: radial-gradient(1100px 520px at 50% -10%, #e8f2ed 0%, rgba(246,247,249,0) 62%);
      color: #1c2430;
    }
    .card {
      width: min(92vw, 390px); padding: 38px 32px; border-radius: 16px;
      background: #fff; border: 1px solid #e3e6ea; text-align: center;
      box-shadow: 0 14px 40px rgba(20,40,32,.09);
    }
    .logo { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #0a5540; font-weight: 700; }
    h1 { font-size: 22px; margin: 12px 0 6px; color: #12211b; }
    .lede { color: #6b7280; font-size: 14px; margin: 0 0 26px; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; text-decoration: none;
      background: #fff; color: #1f2328; font-weight: 600; font-size: 15px;
      padding: 11px 20px; border-radius: 10px; border: 1px solid #d4d9df;
    }
    a.btn:hover { background: #f6f7f9; border-color: #b9c2cb; }
    .g { width: 18px; height: 18px; }
    .or { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; color: #9aa4b2; font-size: 12px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #e3e6ea; }
    form { display: grid; gap: 10px; text-align: left; }
    label { font-size: 12px; color: #6b7280; font-weight: 600; }
    input {
      width: 100%; padding: 11px 14px; font-size: 15px; border-radius: 10px;
      border: 1px solid #d4d9df; background: #fff; color: #1c2430;
    }
    input::placeholder { color: #aab3bd; }
    input#pin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .3em; }
    input:focus { outline: none; border-color: #0a5540; box-shadow: 0 0 0 3px rgba(10,85,64,.14); }
    button {
      margin-top: 4px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      border-radius: 10px; border: none; background: #0a5540; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    button:hover:not(:disabled) { background: #0c6a4f; }
    .err { margin-top: 16px; font-size: 13px; color: #b3261e; min-height: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Recykal · OMP</div>
    <h1>OMP CRM</h1>
    <p class="lede">Sign in to continue</p>

    <!-- Not hidden behind a feature check: with one sign-in method there is
         nothing to choose, and a JS-gated form risks rendering a blank card. -->
    <form id="pinForm">
      <div>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="username" autocapitalize="none"
               autocorrect="off" spellcheck="false" placeholder="you@recykal.com" />
      </div>
      <div>
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
               maxlength="12" placeholder="••••••" />
      </div>
      <button id="go" type="submit">Sign in</button>
    </form>

    <p class="err" id="err"></p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
